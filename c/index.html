<!DOCTYPE html>
<html lang="zh-CN" data-theme="1">
<head>
    <title>标题</title>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
    <meta name="robots" content="noindex,nofollow"/>
    <meta name="referrer" content="no-referrer"/>
    <link rel="icon" href="image/9.webp"/>
    <style>
@font-face{
    font-family:'font';
    src:url('font.ttf') format('truetype');
}
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    color:inherit;
    scrollbar-width:none;
}
html{font-size:100%;color-scheme:light dark;}
html[data-theme="1"]{--seed:1;--primary:#dbba84;--secondary:#b4c587;}
html[data-theme="2"]{--seed:1;--primary:#eb9947;--secondary:#e2c836;}
html[data-theme="3"]{--seed:1;--primary:#7c9eb2;--secondary:#2c96a0;}
html[data-theme="4"]{--seed:1;--primary:#b39fc6;--secondary:#a69fdf;}
html[data-theme="5"]{--seed:1;--primary:#ebaddc;--secondary:#e8a0b4;}
html[data-theme="6"]{--seed:-1;--primary:#16599c;--secondary:#6b7d36;}
html[data-theme="7"]{--seed:-1;--primary:#4a2c6a;--secondary:#503040;}
body{
    background-position:50% 0lvh!important;
    background-repeat:no-repeat!important;
    background-size:cover!important;
    background-attachment:fixed!important;
    background-color:hsl(from var(--primary) h 30 calc(50 + 46 * var(--seed)));
    color:hsl(from var(--primary) h 20 calc(50 - 44 * var(--seed)));
    font-family:'font','微软雅黑',sans-serif;
    &::before{
        position:fixed;
        z-index:-1;
        left:0;
        content:'';
        display:block;
        width:100%;
        height:100%;
        background:hsl(from var(--primary) h 30 calc(50 + 46 * var(--seed)) / var(--opacity,1));
        backdrop-filter:blur(var(--blur,0));
    }
    &::after{
        position:fixed;
        left:0;
        top:0;
        z-index:1;
        content:'';
        display:block;
        width:100%;
        height:40px;
        background:linear-gradient(to bottom,#0002,#0000);
    }
}

::selection{background:hsl(from var(--primary) h s l / 0.6);}
code,var,button,input{font-family:inherit;}
p,dt,dd,li,small,code,b{line-height:1.7em;letter-spacing:0.13em;}
td{line-height:1.4em;letter-spacing:0.12em;}
button,input{border:none;transition:opacity 0.2s;}
input:focus{outline:none;}
input::placeholder{color:hsl(from currentColor h 10 l / 0.4);}
button:hover{opacity:0.8;}
button:disabled{opacity:0.6;}

nav{
    position:fixed;
    z-index:3;
    user-select:none;
    >button{
        position:fixed;
        left:8px;
        top:8px;
        display:block;
        width:32px;
        height:32px;
        border-radius:16px;
        backdrop-filter:blur(10px);
        background-image:url("image/9.webp");
        background-position:50% 50%;
        background-size:cover;
        &:hover{opacity:1;}
    }
    #bar{
        position:fixed;
        right:8px;
        top:6px;
        overflow:hidden;
        display:flex;
        width:112px;
        height:36px;
        border-radius:18px;
        background:hsl(from var(--primary) h s calc(l + 5 * var(--seed)) / 0.6);
        backdrop-filter:blur(6px);
        &::before{
            position:absolute;
            top:0;left:0;
            z-index:-1;
            content:'';
            width:100%;
            height:36px;
            background:hsl(from var(--primary) h 60 50 / 0.5);
            pointer-events:none;
            opacity:0.2;
            transform-origin:left center;
            animation-name:progress;
            animation-timing-function:linear;
            animation-timeline:scroll(root block);
        }
        >div{
            width:24px;
            height:36px;
        }
        >button{
            display:block;
            background:#0000;
            width:32px;
            height:36px;
            padding:6px 4px;
            color:hsl(from var(--primary) h 20 calc(50 - 10 * var(--seed)));
            line-height:30px;
        }
    }
    #search{
        position:fixed;
        left:44px;
        top:8px;
        display:none;
        gap:4px;
        button,input{
            height:32px;
            border-radius:16px;
            backdrop-filter:blur(6px);
            background:hsl(from var(--primary) h s calc(l + 5 * var(--seed)) / 0.6);
            color:hsl(from var(--primary) h 20 calc(50 - 10 * var(--seed)));
        }
        button{
            width:32px;
            &.active{
                background:hsl(32 80 calc(50 + 10 * var(--seed)) / 0.5);
                color:hsl(32 20 calc(50 - 20 * var(--seed)));
            }
        }
        input{width:80px;padding:0 8px;}
    }
    #menu,#setting{
        position:fixed;
        right:8px;
        top:52px;
        background:hsl(from var(--primary) h s calc(l + 5 * var(--seed)) / 0.6);
        border-radius:16px;
        opacity:0;
        pointer-events:none;
        backdrop-filter:blur(4px);
        transform:scale(0.2);
        transition:opacity 0.4s,transform 0.4s cubic-bezier(0.4,0.4,0.2,1.1);
        &.show{opacity:1;transform:scale(1);pointer-events:all;}
    }
    #menu{
        display:flex;
        width:280px;
        height:320px;
        transform-origin:calc(100% - 64px) 0%;
        >div{
            overflow-y:auto!important;
            height:100%;
            >button{
                display:block;
                width:100%;
                margin-top:4px;
                text-align:left;
                text-wrap:nowrap;
                background:#0000;
            }
        }
        >div:nth-of-type(1){
            width:160px;
            padding:4px 0 4px 8px;
            >button{
                position:relative;
                padding:4px 0 4px 16px;
                font-size:1.125rem;
                &.active{
                    background:linear-gradient(to left,#8080800a 10px,#0000);
                    pointer-events:none;
                    &::before,&::after{
                        position:absolute;
                        right:0;
                        display:block;
                        content:'';
                        width:10px;
                        height:10px;
                    }
                    &::before{
                        top:-10px;
                        background:radial-gradient(circle at top left,#0000 10px,#8080800a 10px);
                    }
                    &::after{
                        bottom:-10px;
                        background:radial-gradient(circle at bottom left,#0000 10px,#8080800a 10px);
                    }
                }
            }
        }
        >div:nth-of-type(2){
            overflow:hidden;
            width:100%;
            padding:4px 4px;
            background:#8080800a;
            >button{font-size:1rem;padding:6px 12px;}
            >p{
                margin:2px;
                padding-left:12px;
                font-size:0.875rem;
                opacity:0.7;
            }
        }
    }
    #setting{
        display:flex;
        flex-direction:column;
        gap:8px;
        width:220px;
        height:auto;
        padding:8px;
        transform-origin:calc(100% - 32px) 0%;
        >div{
            display:flex;
            justify-content:center;
            gap:8px;
            &:first-child{gap:6px;}
        }
        input[type="radio"]{
            appearance:none;
            width:22px;
            height:22px;
            border-radius:11px;
            opacity:0.4;
            &:checked{opacity:1;outline:2px solid hsl(from var(--primary) h s l / 0.5);}
        }
        button{
            width:100%;
            height:32px;
            background:hsl(from var(--primary) h s l / 0.3);
            font-size:1rem;
            border-radius:16px;
            text-wrap:nowrap;
        }
        input[type="range"]{
            appearance:none;
            width:100%;
            height:32px;
            padding:4px;
            border-radius:16px;
            background:hsl(from var(--primary) h s l / 0.3);
            &::before{
                position:absolute;
                content:attr(title);
                display:block;
                line-height:24px;
                font-size:1rem;
                margin-left:12px;
                pointer-events:none;
            }
            &::-webkit-slider-thumb{
                appearance:none;
                width:24px;height:24px;border-radius:12px;
                background:hsl(from var(--primary) h s calc(50 - 10 * var(--seed)) / 0.4);
            }
            &::-webkit-range-thumb{
                width:24px;height:24px;border-radius:12px;
                background:hsl(from var(--primary) h s calc(50 - 10 * var(--seed)) / 0.4);
            }
        }
        #deleteDataBtn,#deletebgBtn{
            background:#f003;
            color:hsl(0 70 calc(50 - 40 * var(--seed)));
        }
    }
}
@keyframes progress{from{transform:scaleX(0);}to{transform:scaleX(1);}}

main{
    --theme:var(--primary);
    min-height:100vh;
    background:linear-gradient(160deg,hsl(from var(--theme) h s l / 0.4),#0000 60vh);
    *[id]{scroll-margin-top:40px;}
}
main:not(#HOME){
    padding:12px;
    @media(width>=768px){padding:12px 100px;}
    &::before{
        position:static;
        display:block;
        margin:80px 8px 40px 8px;
        content:attr(data-title);
        font-weight:bold;
        font-size:4rem;
        text-align:center;
    }
}
main>h1{
    margin:12px 0 20px 20px;
    font-size:1.875rem;
    position:relative;
    &::before{
        position:absolute;display:inline-block;content:"";
        width:12px;left:-20px;top:8px;bottom:8px;
        background:hsl(from var(--theme) h s l / 0.5);
        border-radius:6px;
    }
}
main>h2{
    font-size:1.5rem;
    margin:16px 0;
    letter-spacing:0.1em;
}
main>h3{
    position:relative;
    display:inline-block;
    width:auto;
    margin:8px 4px 12px 4px;
    font-size:1.125rem;
    color:hsl(from var(--theme) h 20 calc(50 - 20 * var(--seed)));
    &::after{
        position:absolute;
        content:'';
        left:-4px;
        top:1.6ex;
        right:-4px;
        height:12px;
        border-radius:6px;
        background:hsl(from var(--theme) h 40 calc(50 - 30 * var(--seed)) / 0.3);
    }
}
h4{text-align:center;font-size:1.375rem;}
p{margin:10px 0;}
a{
    color:hsl(from var(--primary) h 80 calc(50 - 20 * var(--seed)));
    text-decoration-style:dotted;
    &:hover{opacity:0.8;}
}
em{
    background:hsl(from var(--primary) h 60 calc(50 + 20 * var(--seed)) / 0.3);
    font-style:normal;
    color:hsl(from var(--primary) h 30 calc(50 - 30 * var(--seed)));
    padding:2px 3px;
    border-radius:4px;
    margin:0 3px;
}
small{opacity:0.7;}
hr{
    border:0;
    border-radius:1px;
    margin:15px 10px;
    padding:0.8px;
    background:linear-gradient(to right,
        #0000 0%,
        hsl(from var(--theme) h 50 50 / 0.5) 20%,
        hsl(from var(--theme) h 50 50 / 0.5) 80%,
        #0000 100%
    );
}
ul,ol,main:not(#EVE)>dl{
    margin:8px 0 8px 2em;
    li,dt{color:hsl(from var(--theme) h 30 calc(50 - 30 * var(--seed)))}
    dt{display:list-item;list-style-type:disc;}
    dd{font-size:0.875rem;opacity:0.8;}
}
sup{
    line-height:0;
    opacity:0.8;
    font-size:10px;
}
main svg,img,audio,video{
    width:400px;
    max-width:100%;
    border-radius:16px;
    display:block;
    margin:12px auto;
}
article,q,code,table,details,.writing,.timeline{
    display:block;
    margin:12px 0;
    padding:16px;
    border-radius:16px;
}
article{
    background:hsl(from var(--primary) h s l / 0.4);
    color:hsl(from var(--primary) h 30 calc(50 - 40 * var(--seed)));
    >p{text-indent:2.26em;}
    &:has(>b){
        display:grid;
        gap:4px;
        grid-template-columns:auto 1fr;
        >p{text-indent:0!important;margin:0!important;}
        >b{text-wrap:nowrap;text-align:right;font-weight:bold;}
    }
}
q{
    background:hsl(from var(--secondary) h s l / 0.4);
    color:hsl(from var(--secondary) h 40 calc(50 - 30 * var(--seed)));
    font-size:1.5625rem;
    text-wrap:balance;
    text-align:center;
    padding:8px;
    &::before,&::after{display:none;}
}
code{
    background:hsl(from var(--theme) h 20 calc(50 - 10 * var(--seed)) / 0.2);
    text-align:center;
    font-size:1.125rem;
    color:hsl(from var(--theme) h 15 calc(50 - 30 * var(--seed)));
    text-wrap:balance;
    p{margin:0;}
}
table{
    width:100%;
    overflow:hidden;
    padding:0;
    border-collapse:collapse;
    display:table;
    background:hsl(from var(--primary) h s l / 0.3);
    td{text-align:center;}
    th{
        font-size:1.125rem;
        background:hsl(from var(--primary) h s l / 0.4);
        color:hsl(from var(--primary) h calc(s + 10) calc(50 - 30 * var(--seed)));
    }
    td,th{
        outline:0.5px solid hsl(from var(--primary) h s calc(50 + 20 * var(--seed)));
        padding:12px 4px;
        min-width:3em;
        text-wrap:balance;
    }
    @media(width<768px){
        &.scroll{
            overflow-x:auto;
            display:block;
            mask-image:linear-gradient(to right,#0008,#000 20px,#000 calc(100% - 20px),#0008);
            td,th{padding:8px;width:200px;text-wrap:nowrap;}
        }
    }
}
.writing{
    background:linear-gradient(to bottom,hsl(from var(--secondary) h s l / 0.5),hsl(from var(--secondary) h s l / 0.3));
    color:hsl(from var(--secondary) h 20 calc(50 - 30 * var(--seed)));
    h4{
        text-align:center;
        font-size:2.5rem;
        margin:16px 0;
    }
    strong{
        display:block;
        opacity:0.8;
        font-size:0.875rem;
        text-align:center;
        font-weight:bold;
        margin:4px 0;
        text-indent:0;
    }
    p{text-indent:2.26em;}
    &:has(>b){
        display:grid;
        gap:4px;
        grid-template-columns:auto 1fr;
        >p{text-indent:0!important;margin:0!important;}
        >b{text-wrap:nowrap;text-align:right;font-weight:bold;}
        >h4,>p:has(strong),>hr{grid-column:span 2;}
    }
}
.timeline{
    background:linear-gradient(135deg,hsl(from var(--primary) h s l / 0.3),hsl(from var(--primary) h s l / 0.2));
    position:relative;
    &::before{
        content:'';
        position:absolute;
        left:24px;
        top:0;
        bottom:0;
        width:4px;
        background:linear-gradient(to bottom,
            #0000 0,
            hsl(from var(--primary) h s l / 0.5) 16px,
            hsl(from var(--primary) h s l / 0.5) calc(100% - 15px),
            #0000 100%);
    }
    dt{
        background:#80808030;
        padding:0 32px;
        line-height:40px;
        font-size:1.125rem;
        margin:0 20px;
        border-radius:20px;
        display:inline-block;
        width:auto;
    }
    dd{
        background:linear-gradient(to right,#80808020,#0000);
        color:hsl(from var(--primary) h 20 calc(50 - 30 * var(--seed)));
        padding:4px 12px;
        margin:12px 28px;
        border-radius:16px;
        position:relative;
        &::before{
            content:'';
            position:absolute;
            display:block;
            width:12px;
            height:12px;
            border-radius:50%;
            background:var(--primary);
            left:-24px;
            top:calc(50% - 6px);
        }
    }
}

.keywords{
    display:flex;
    justify-content:center;
    gap:8px;
    >p{
        margin:0!important;
        padding:0 8px;
        font-size:0.875rem;
        line-height:28px;
        border-radius:14px;
        color:hsl(from var(--theme) h s calc(50 - 30 * var(--seed)));
        background:hsl(from var(--theme) h s l / 0.4);
    }
    &.m:after,&.w:after{
        display:block;
        content:'';
        position:static;
        width:28px;
        height:28px;
    }
    &.m:after{
        background-image:url("data:image/svg+xml,%3Csvg width='28' height='28' xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='28' height='28' fill='%2308f5' rx='14' x='0' y='0'%3E%3C/rect%3E%3Cpath d='M11 11 A 6 6 0 0 1 11 23 A 6 6 0 0 1 11 11 M15.3 12.7 L 21 7 M17 7 L 21 7 L 21 11' stroke='%2308f' stroke-width='1.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
    }
    &.w:after{
        background-image:url("data:image/svg+xml,%3Csvg width='28' height='28' xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='28' height='28' fill='%23c395' rx='14' x='0' y='0'%3E%3C/rect%3E%3Cpath d='M14 5 A 6 6 0 0 1 14 17 A 6 6 0 0 1 14 5 M14 17 L 14 23 M12 21 L 16 21' stroke='%23c39' stroke-width='1.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
    }
}
.gantt{
    position:relative;
    overflow:hidden;
    margin:12px 16px;
    padding:0 12px;
    height:40px;
    font-size:1.125rem;
    line-height:40px;
    border-radius:20px;
    color:hsl(from var(--theme) h s calc(50 - 35 * var(--seed)));
    background:linear-gradient(to right,
        hsl(from var(--theme) h s l / 0.1) calc(50% / 3),
        hsl(from var(--theme) h s l / 0.2) calc(50% / 3),
        hsl(from var(--theme) h s l / 0.2) calc(100% / 3),
        hsl(from var(--theme) h s l / 0.1) calc(100% / 3),
        hsl(from var(--theme) h s l / 0.1) 50%,
        hsl(from var(--theme) h s l / 0.2) 50%,
        hsl(from var(--theme) h s l / 0.2) calc(200% / 3),
        hsl(from var(--theme) h s l / 0.1) calc(200% / 3),
        hsl(from var(--theme) h s l / 0.1) calc(250% / 3),
        hsl(from var(--theme) h s l / 0.2) calc(250% / 3)
    );
    &::before,&::after{
        position:absolute;top:0;bottom:0;z-index:-1;
        display:block;content:"";
        background:repeating-linear-gradient(-45deg,
            hsl(from var(--theme) h s l / 0.1),
            hsl(from var(--theme) h s l / 0.1) 8px,
            hsl(from var(--theme) h s l / 0.4) 8px,
            hsl(from var(--theme) h s l / 0.4) 16px,
            hsl(from var(--theme) h s l / 0.1) 16px
        );
    }
    &::before{
        left:calc(50% / 3 * var(--gantt-s));
        right:calc(100% - 50% / 3 * var(--gantt-e));
    }
    &::after{
        left:calc(50% / 3 * var(--gantt-s2));
        right:calc(100% - 50% / 3 * var(--gantt-e2));
    }
}
.content{
    margin:12px 16px;
    padding:16px;
    border-radius:16px;
    background:hsl(from var(--theme) calc(h - 10) 50 l / 0.2);
    color:hsl(from var(--theme) h 20 calc(50 - 35 * var(--seed)));
    &::before{
        display:block;
        content:"本文目录";
        margin:8px;
        font-size:1.375rem;
        font-weight:bold;
        opacity:0.7;
    }
    dt{
        position:relative;
        padding:4px 12px;
        font-size:1.125rem;
        font-weight:bold;
        color:hsl(from var(--theme) h 20 calc(50 - 30 * var(--seed)));
    }
    dd{
        padding:0 20px;
        color:hsl(from var(--theme) h 20 calc(50 - 25 * var(--seed)));
    }
    span{
        display:inline-block;
        margin:4px;
        padding:0 12px;
        font-size:0.875rem;
        line-height:24px;
        text-wrap:nowrap;
        background:hsl(from var(--theme) h s l / 0.1);
        color:hsl(from var(--theme) h 20 calc(50 - 20 * var(--seed)));
        border-radius:12px;
    }
}
.nick{
    margin:12px 16px;
    padding:16px;
    border-radius:16px;
    background:hsl(from var(--theme) h 50 l / 0.2);
    color:hsl(from var(--theme) h s calc(50 - 35 * var(--seed)));
    &::before{
        display:block;
        content:"外号";
        margin:8px;
        font-size:1.375rem;
        font-weight:bold;
        opacity:0.7;
    }
    >p{
        font-size:1.125rem;
        background:hsl(from var(--theme) h s l / 0.2);
        padding:4px 16px;
        border-radius:99px;
        margin:8px;
        text-wrap:nowrap;
    }
}

.pages{
    display:flex;
    width:100%;
    padding:20px;
    gap:16px;
    justify-content:center;
    flex-wrap:wrap;
    user-select:none;
    >button{
        display:block;
        padding:12px 24px;
        width:200px;
        color:hsl(from currentColor h s l / 0.8);
        font-size:1.125rem;
        border-radius:16px;
        &:last-child{
            text-align:left;
            background:linear-gradient(to right,hsl(from var(--primary) h s l / 0.2),#0000);
        }
        &:first-child{
            text-align:right;
            background:linear-gradient(to left,hsl(from var(--primary) h s l / 0.2),#0000);
        }
    }
}
footer{
    padding:100px 32px 56px 32px;
    color:#fffa;
    background:linear-gradient(#0000,#0008 120px);
}


#EVENT{
    >h1{
        margin:24px 16px;
        padding:8px;
        color:hsl(from var(--primary) h 20 calc(50 - 30 * var(--seed)));
        background:hsl(from var(--primary) h s l / 0.3);
        text-align:center;
        border-radius:99px;
        &::before{display:none;}
    }
    >div:not(.pages){
        position:relative;
        width:100%;
        margin:8px 0;
        padding:12px;
        background:hsl(from var(--primary) h s l / 0.2);
        border-radius:16px;
        &:not(#EVENT-1+div)::before{
            position:absolute;
            top:4px;
            left:4px;
            content:attr(time);
            display:flex;
            justify-content:center;
            align-items:center;
            width:1.9em;
            height:1.9em;
            border-radius:12px;
            font-weight:700;

<script>
//===IndexedDB===
const DB_NAME='AppDB';
const STORES={text:'textStore',bg:'bgStore'};
const KEYS={text:'textContent',bg:'bg'};
function openDB(){
    return new Promise((resolve,reject)=>{
        const request=indexedDB.open(DB_NAME,1);
        request.onupgradeneeded=(event)=>{
            const db=event.target.result;
            for(const storeName of Object.values(STORES)){
                if(!db.objectStoreNames.contains(storeName)){
                    const store=db.createObjectStore(storeName);
                    if(storeName===STORES.bg){store.keyPath='id';}
                }
            }
        };
        request.onsuccess=(event)=>resolve(event.target.result);
        request.onerror=(event)=>reject(event.target.error);
    });
}
function saveData(storeName,key,value){
    return openDB().then(db=>{
        return new Promise((resolve,reject)=>{
            const tx=db.transaction(storeName,'readwrite');
            const store=tx.objectStore(storeName);
            const data=storeName===STORES.bg?{id: key,data:value}:value;
            const req=store.put(data,key);
            req.onsuccess=()=>resolve();
            req.onerror=()=>reject(req.error);
            tx.oncomplete=()=>db.close();
        });
    });
}
function loadData(storeName,key){
    return openDB().then(db=>{
        return new Promise((resolve,reject)=>{
            const tx=db.transaction(storeName,'readonly');
            const store=tx.objectStore(storeName);
            const req=store.get(key);
            req.onsuccess=()=>{
                const result=req.result;
                if(storeName===STORES.bg&&result){resolve(result.data);}
                else{resolve(result??null);}
            };
            req.onerror=()=>reject(req.error);
            tx.oncomplete=()=>db.close();
        });
    });
}
function deleteData(storeName,key){
    return openDB().then(db=>{
        return new Promise((resolve,reject)=>{
            const tx=db.transaction(storeName,'readwrite');
            const store=tx.objectStore(storeName);
            const req=store.delete(key);
            req.onsuccess=()=>resolve();
            req.onerror=()=>reject(req.error);
            tx.oncomplete=()=>db.close();
        });
    });
}
function deleteDB(){
    if(confirm('出现错误，建议重置数据库。')){
        const d=indexedDB.deleteDatabase(DB_NAME);
        d.onsuccess=function(){console.log('删除成功')};
        d.onerror=function(){console.log('删除失败')};
    }
}
//===文件===
function processText(text){
    saveData(STORES.text,KEYS.text,text).then(()=>{
        const pages=parseDocument(text);
        renderPages(pages);
        initApp();
    }).catch(()=>{deleteDB();});
}
function restoreFromDB(){
    return loadData(STORES.text,KEYS.text).then(text=>{
        if (text!==null&&text!==''){
            const pages=parseDocument(text);
            renderPages(pages);
        }
    }).catch(()=>{deleteDB();});
}
//===文本解析===
function processEscape(line){
    let result='',i=0;
    const specials='#-+:{}[]|*^$\\!<>';
    while(i<line.length){
        if(line[i]==='\\'){
            if(i+1<line.length){
                if(specials.includes(line[i+1])){result+=line[i+1];i+=2;}
                else{result+='<br>';i++;}
            }
            else{i++;}
        }
        else{result+=line[i];i++;}
    }
    return result;
}
function parseInlineA(str){
    str=str.replace(/\[([^\]]*)\]\(([^)]*)\)/g,'<a href="$2">$1</a>');
    str=str.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>');
    str=str.replace(/\*(.*?)\*/g,'<em>$1</em>');
    str=str.replace(/\$(.*?)\$/g,'<small>$1</small>');
    str=str.replace(/\^(.*?)\^/g,'<sup>$1</sup>');
    return str;
}
function parseInlineB(str){
    str=str.replace(/\[([^\]]*)\]\(([^)]*)\)/g,'<a href="$2">$1</a>');
    str=str.replace(/\[([^\]]*)\]/g,'<i>$1</i>');
    str=str.replace(/\(([^)]*)\)/g,'<b>$1</b>');
    return str;
}
function parseTable(rows){
    let html='<table';
    if(rows[0].trim()==='|::|'){html+=' class="scroll"';rows=rows.slice(1);}
    html+='>';
    for(let row of rows){
        let cells=row.slice(1,-1).split('|');
        let cellHtmls=[];
        for(let cell of cells){
            let leftSpaces=cell.match(/^\s*/)[0].length;
            let rightSpaces=cell.match(/\s*$/)[0].length;
            let content=cell.trim();
            let isTh=false;
            if(content.startsWith(':')){isTh=true;content=content.slice(1).trim();}
            let rowspan=leftSpaces>0?leftSpaces+1:1;
            let colspan=rightSpaces>0?rightSpaces+1:1;
            let tag=isTh?'th':'td';
            let attrs='';
            if(rowspan>1) attrs+=` rowspan="${rowspan}"`;
            if(colspan>1) attrs+=` colspan="${colspan}"`;
            cellHtmls.push(`<${tag}${attrs}>${parseInlineA(content)}</${tag}>`);
        }
        html+='<tr>'+cellHtmls.join('')+'</tr>';
    }
    html+='</table>';
    return html;
}
function parseList(items){
    let html='';
    let topIndices=[];
    for(let idx=0;idx<items.length;idx++){
        if(items[idx].indent===0){topIndices.push(idx);}
    }
    if(topIndices.length===0)return html;
    let outerTag=items[topIndices[0]].marker==='-'?'ul':'ol';
    html+=`<${outerTag}>`;
    for(let t=0;t<topIndices.length;t++){
        let idx=topIndices[t];
        let top=items[idx];
        let nextTopIdx=(t+1<topIndices.length)?topIndices[t+1]:items.length;
        let subItems=[];
        for(let j=idx+1;j<nextTopIdx;j++){
            if(items[j].indent===1){subItems.push(items[j]);}
        }
        html+=`<li>${parseInlineA(top.content)}</li>`;
        if(subItems.length>0){
            let innerTag=subItems[0].marker==='-'?'ul':'ol';
            html+=`<${innerTag}>`;
            for(let sub of subItems){
                html+=`<li>${parseInlineA(sub.content)}</li>`;
            }
            html+=`</${innerTag}>`;
        }
    }
    html+=`</${outerTag}>`;
    return html;
}
function parseDl(lines){
    let html='<dl>';
    for(let line of lines){
        if(line.startsWith(':: ')){html+=`<dt>${parseInlineA(line.slice(3))}</dt>`;}
        else if(line.startsWith(': ')){html+=`<dd>${parseInlineA(line.slice(2))}</dd>`;}
    }
    html+='</dl>';
    return html;
}
function parseArticle(lines){
    let className='';
    let contentLines=lines;
    let first=lines[0];
    let trimmedFirst=first.trim();
    if(trimmedFirst.match(/^\{[^}]*\}$/)){
        className=trimmedFirst.slice(1,-1);
        contentLines=lines.slice(1);
    }
    let innerLines=contentLines.map(line=>line.slice(2));
    let innerHtml=parseContentA(innerLines,true);
    let classAttr=className?` class="${className}"`:'';
    return `<article${classAttr}>${innerHtml}</article>`;
}
function parseContentA(lines,insideArticle){
    let html='', i=0;
    const inline=parseInlineA;
    while(i<lines.length){
        let line=lines[i];
        let trimmed=line.trim();
        if(trimmed===''){i++;continue;}
        if(line.startsWith('|')&&line.endsWith('|')&&line.length>1){
            let rows=[];
            while(i<lines.length&&lines[i].startsWith('|')&&lines[i].endsWith('|')){
                rows.push(lines[i]);i++;
            }
            html+=parseTable(rows,'A');
            continue;
        }
        if(line.startsWith(' ')&&line.length>2){
            let indented=[];
            while(i<lines.length&&lines[i].startsWith(' ')&&lines[i].length>2){
                indented.push(lines[i]);i++;
            }
            html+=parseArticle(indented,'A');
            continue;
        }
        if(line.match(/^( {0,1})([-+]) /)){
            let items=[];
            while(i<lines.length){
                let m=lines[i].match(/^( {0,1})([-+]) /);
                if(!m)break;
                items.push({indent:m[1].length,marker:m[2],content:lines[i].slice(m[0].length)});
                i++;
            }
            html+=parseList(items,'A');
            continue;
        }
        if(line.match(/^: /)||line.match(/^:: /)){
            let dlLines=[];
            while(i<lines.length&&(lines[i].match(/^: /)||lines[i].match(/^:: /))){
                dlLines.push(lines[i]);i++;
            }
            html+=parseDl(dlLines,'A');
            continue;
        }
        let imgMatch=trimmed.match(/^!\[(.*?)\]\((.*?)\)$/);
        if(imgMatch){html+=`<img src="${imgMatch[2]}" alt="${imgMatch[1]}"/>`;i++;continue;}
        if(trimmed==='---'){html+='<hr>';i++;continue;}
        let hMatch=trimmed.match(/^(#{1,6}) /);
        if(hMatch){
            let level=hMatch[1].length;
            let content=line.slice(hMatch[0].length);
            html+=`<h${level}>${inline(content)}</h${level}>`;
            i++;continue;
        }
        if(trimmed.startsWith('> ')){
            html+=`<q>${inline(line.slice(2))}</q>`;
            i++;continue;
        }
        if(trimmed.startsWith('= ')){
            html+=`<code>${inline(line.slice(2))}</code>`;
            i++;continue;
        }
        let pContent=line;
        if(insideArticle){
            const colonIndex=pContent.indexOf(' : ');
            if(colonIndex!==-1) {
                const leftPart = pContent.substring(0, colonIndex).trim();
                const rightPart = pContent.substring(colonIndex + 3).trim();
                html += `<b>${inline(leftPart)}</b><p>${inline(rightPart)}</p>`;
                i++;
                continue;
            }
        }
        html+=`<p>${inline(pContent)}</p>`;i++;
    }
    return html;
}
function parseContentB(lines){
    let html='';
    let currentDiv=null;
    const inline=parseInlineB;
    function closeDiv(){
        if(currentDiv){
            let innerHtml='';
            let j=0;
            const innerLines=currentDiv.contentLines;
            while(j<innerLines.length){
                let line=innerLines[j];
                let trimmed=line.trim();
                if(trimmed===''){j++;continue;}
                if(trimmed.startsWith('# ')){
                    innerHtml+=`<h1>${inline(line.slice(2))}</h1>`;
                    j++;continue;
                }
                let hot=false, unsure=false;
                let contentLine=line;
                if(trimmed.startsWith('!')){
                    hot=true;
                    contentLine=line.replace(/^!\s*/,'');
                }else if(trimmed.startsWith('?')){
                    unsure=true;
                    contentLine=line.replace(/^\?\s*/,'');
                }
                let attrs='';
                if(hot)attrs+=' data-hot';
                if(unsure)attrs+=' data-unsure';
                innerHtml+=`<p${attrs}>${inline(contentLine)}</p>`;
                j++;
            }
            let classAttr=currentDiv.classes.length>0?' class="'+currentDiv.classes.join(' ')+'"':'';
            html+=`<div time="${currentDiv.time}"${classAttr}>${innerHtml}</div>`;
            currentDiv=null;
        }
    }
    for(let line of lines){
        let trimmed=line.trim();
        if(trimmed==='')continue;
        if(trimmed.startsWith('# ')){
            closeDiv();
            let content=line.slice(2);
            html+=`<h1>${inline(content)}</h1>`;
            continue;
        }
        if(trimmed.startsWith('$ ')){
            closeDiv();
            let rest=line.slice(2);
            let parts=rest.match(/\S+/g);
            if(parts){
                let date=parts[0]||'';
                let classes=parts.slice(1);
                currentDiv={time:date, classes:classes, contentLines:[]};
            }else{
                currentDiv={time:'', classes:[], contentLines:[]};
            }
            continue;
        }
        if(!currentDiv){
            currentDiv={time:'', classes:[], contentLines:[]};
        }
        currentDiv.contentLines.push(line);
    }
    closeDiv();
    return html;
}
function parseDocument(text){
    const pages=[];
    const lines=text.split(/\r?\n/);
    let currentPage=null;
    let state='metadata';
    for(const rawLine of lines){
        const line=rawLine;
        if(line.trim()==='====='){
            if(currentPage!==null) pages.push(currentPage);
            currentPage=null;
            state='metadata';
            continue;
        }
        if(state==='metadata'){
            if(line.trim()==='') continue;
            const parts=line.trim().split(/\s+/);
            if(parts.length>=3){
                const title=parts.slice(0, -2).join(' ');
                const id=parts[parts.length-2];
                const theme=parts[parts.length-1];
                currentPage={metadata:{title,id,theme},contentLines:[]};
                state='content';
            }else{
                currentPage={metadata:{title:'',id:'',theme:''},contentLines:[]};
                state='content';
            }
        }else if(state==='content'){
            if(currentPage!==null) currentPage.contentLines.push(line);
        }
    }
    if(currentPage!==null) pages.push(currentPage);
    return pages.map(page=>{
        const processed=page.contentLines.map(line=>processEscape(line));
        let html='';
        if(page.metadata.id==='EVENT'){html=parseContentB(processed);}
        else{html=parseContentA(processed,false);}
        return {id:page.metadata.id, title:page.metadata.title, theme:page.metadata.theme, html};
    });
}
function renderPages(pages){
    document.querySelectorAll('main:not(#HOME)').forEach(e=>e.remove());
    for(const page of pages){
        if(page.id==='HOME')continue;
        const main=document.createElement('main');
        main.id=page.id;
        main.dataset.title=page.title;
        main.style.setProperty('--theme',page.theme);
        main.innerHTML=page.html;
        document.getElementById('root').appendChild(main);
    }
}
//===标题层级===
function extractStructure(){
    const result=[];
    document.querySelectorAll('main').forEach((main)=>{
        const structure=[];
        main.querySelectorAll(':scope>h1,:scope>h2,:scope>h3').forEach((el,index)=>{
            el.id=main.id+'-'+(index+1);
            structure.push({
                element:el.tagName.toLowerCase(),
                text:el.textContent,
                index:index+1,
                id:el.id
            });
            el.addEventListener('click',()=>{showPage(main.id,index+1);});
        });
        const mainData={
            title:main.dataset.title,
            id:main.id,
            structure:structure
        };
        result.push(mainData);
    });
    return result;
};
let pageData=[];
//===页面切换===
function handleHashChange(){
    const hash=window.location.hash;
    if(!hash||hash==='#'){showPage('HOME');return;}
    const parts=hash.substring(1).split('-');
    const page=parts[0];
    const id=parts.slice(1).join('-');
    pageData.find(p=>p.id===page)?showPage(page,id):showPage('HOME');
}
function showPage(page,id){
    const updateHash=(hashValue)=>{
        const newHash=`#${hashValue}`;
        if(window.location.hash!==newHash)history.pushState(null,'',newHash);
    };
    document.querySelectorAll('main').forEach(main=>{main.style.display='none';});
    let targetMain=null;
    let targetId=null;
    if(id){
        const fullId=`${page}-${id}`;
        const element=document.getElementById(fullId);
        if(element){targetMain=element.closest('main');targetId=fullId;}
    }
    if(!targetMain){targetMain=document.querySelector(`main#${page}`);}
    if(!targetMain){targetMain=document.querySelector('main#HOME');updateHash('HOME');}
    else{updateHash((id&&targetId)?`${page}-${id}`:page);}
    targetMain.style.display='block';
    if(id&&targetId){
        const target=document.getElementById(targetId);
        if(target){target.scrollIntoView({behavior:'smooth',block:'start'});}
    }
    else{targetMain.scrollIntoView({behavior:'auto',block:'start'});}
    generateMenu();
    document.querySelectorAll('#menu button').forEach(e=>{e.classList.remove('active')});
    document.querySelector(`#menu button[onclick*="${page}"]`).classList.add('active');
    document.querySelector('#search').style.display=page==='EVENT'?'flex':'none';
}
//===菜单生成===
function getCurrentPageId(){
    const mains=document.querySelectorAll('main');
    for(const main of mains){if(main.style.display!=='none')return main.id;}
    return 'HOME';
}
function generateMenu(){
    const currentPageId=getCurrentPageId();
    const menu=document.getElementById('menu');
    let pageHtml='';
    pageData.forEach(p=>{
        pageHtml+=`<button onclick="showPage('${p.id}')">${p.title}</button>`;
    });
    menu.querySelector('div:first-child').innerHTML=pageHtml;
    const currentPage=pageData.find(p=>p.id===currentPageId);
    let headingHtml='';
    if(!currentPage)return;
    currentPage.structure.forEach(item=>{
        const clickAttr=`onclick="showPage('${currentPageId}',${item.index})"`;
        let tag='';
        if(item.element==='h1')tag='button';
        else if(item.element==='h2')tag='p';
        else return;
        headingHtml+=`<${tag} ${clickAttr}>${item.text}</${tag}>`;
    });
    menu.querySelector('div:last-child').innerHTML=headingHtml;
}
//===目录生成===
function generateContents(){
    document.querySelectorAll('main').forEach(main=>{
        const container=main.querySelector('.content');
        if(!container)return;
        const pageId=main.id;
        if(pageId==='HOME')return;
        const pageInfo=pageData.find(p=>p.id===pageId);
        if(!pageInfo||pageInfo.structure.length===0)return;
        const dl=document.createElement('dl');
        const htmlParts=[];
        pageInfo.structure.forEach(item=>{
            const clickAttr=`onclick="showPage('${pageId}',${item.index})"`;
            let tag='';
            if(item.element==='h1')tag='dt';
            else if(item.element==='h2')tag='dd';
            else if(item.element==='h3')tag='span';
            if(tag)htmlParts.push(`<${tag} ${clickAttr}>${item.text}</${tag}>`);
        });
        if(htmlParts.length>0){
            dl.innerHTML=htmlParts.join('');
            container.appendChild(dl);
        }
    });
}
//===翻页按钮===
function generateNavigation(){
    document.querySelectorAll('main').forEach(main=>{
        const pageId=main.id;
        const dataIndex=pageData.findIndex(p=>p.id===pageId);
        if(pageId==='HOME')return;
        let prevHtml='';
        let nextHtml='';
        const prevIdx=dataIndex-1;
        const nextIdx=dataIndex+1;
        const prevPage=pageData[prevIdx];
        prevHtml=`<button onclick="showPage('${prevPage.id}')">${prevPage.title}</button>`;
        if(nextIdx<pageData.length){
            const nextPage=pageData[nextIdx];
            nextHtml=`<button onclick="showPage('${nextPage.id}')">${nextPage.title}</button>`;
        }
        const pagesDiv=document.createElement('div');
        pagesDiv.className='pages';
        pagesDiv.innerHTML=prevHtml+nextHtml;
        main.appendChild(pagesDiv);
    });
}
//===打开/关闭菜单===
document.addEventListener('click',function(e){
    const menuBtn=document.querySelector('#bar button:first-of-type');
    const settingBtn=document.querySelector('#bar button:last-of-type');
    const menu=document.getElementById('menu');
    const setting=document.getElementById('setting');
    const t=e.target;
    if(t===menuBtn||menuBtn.contains(t)){
        if(menu.classList.contains('show')){menu.classList.remove('show');}
        else{menu.classList.add('show');setting.classList.remove('show');}
        return;
    }
    if(t===settingBtn||settingBtn.contains(t)){
        if(setting.classList.contains('show')){setting.classList.remove('show');}
        else{setting.classList.add('show');menu.classList.remove('show');}
        return;
    }
    if(menu.classList.contains('show')){menu.classList.remove('show');}
    if(setting.classList.contains('show')&&!setting.contains(t)){setting.classList.remove('show');}
});
//===个性化===
async function applyBG(){
    const data=await loadData(STORES.bg,KEYS.bg);
    document.body.style.backgroundImage=data?`url(${data})`:'';
}
let settings={theme:'1',opacity:1,blur:0};
function applySettings(){
    document.documentElement.setAttribute('data-theme',settings.theme);
    document.querySelector(`#t${settings.theme}`).checked=true;
    document.getElementById('r1').value=settings.opacity;
    document.documentElement.style.setProperty('--opacity',settings.opacity);
    document.getElementById('r2').value=settings.blur;
    document.documentElement.style.setProperty('--blur',settings.blur+'px');
}
document.querySelectorAll('input[name="t"]').forEach(el=>{
    el.addEventListener('change',function(){
        if(this.checked){
            settings.theme=this.id.replace('t','');
            localStorage.setItem('setting',JSON.stringify(settings));
            applySettings();
        }
    });
});
document.getElementById('r1').addEventListener('input',function(){
    settings.opacity=this.value;
    localStorage.setItem('setting',JSON.stringify(settings));
    applySettings();
});
document.getElementById('r2').addEventListener('input',function(){
    settings.blur=this.value;
    localStorage.setItem('setting',JSON.stringify(settings));
    applySettings();
});
document.getElementById('updatebgBtn').addEventListener('click', () => {
    const inp=document.createElement('input');
    inp.type='file';
    inp.accept='image/*';
    inp.onchange=async function(e){
        const f=e.target.files[0];
        if(f){
            const reader=new FileReader();
            reader.onload=async function(ev){
                await saveData(STORES.bg,KEYS.bg,ev.target.result);
                await applyBG();
            };
            reader.readAsDataURL(f);
        }
    };
    inp.click();
});
document.getElementById('deletebgBtn').addEventListener('click',async ()=>{
    await deleteData(STORES.bg,KEYS.bg);
    await applyBG();
});
document.getElementById('updateDataBtn').addEventListener('click',function(){
    const inp=document.createElement('input');
    inp.type='file';
    inp.accept='.txt';
    inp.onchange=function(e){
        const file=e.target.files[0];
        if(!file) return;
        const reader=new FileReader();
        reader.onload=function(ev){processText(ev.target.result)};
        reader.readAsText(file,'UTF-8');
    };
    inp.click();
});
document.getElementById('deleteDataBtn').addEventListener('click',function(){
    deleteData(STORES.text,KEYS.text).then(()=>{initApp();}).catch(()=>{deleteDB();});
});
//===日志页面===
let hotMode=false;
let searchText='';
document.querySelector('#search>input').addEventListener('input',function(){
    searchText=this.value;
    filterEventContent();
});
document.querySelector('#search>button').addEventListener('click',function(){
    hotMode=!hotMode;
    this.classList.toggle('active');
    filterEventContent();
});
function filterEventContent(){
    const eventMain=document.getElementById('EVENT');
    eventMain.querySelectorAll('p').forEach(p=>{
        let show=true;
        if(
            (hotMode&&!p.hasAttribute('data-hot'))||
            (searchText.trim()!==''&&!p.textContent.toLowerCase().includes(searchText.trim().toLowerCase()))
        )show=false;
        p.style.display=show?'':'none';
    });
    eventMain.querySelectorAll(':scope>div:not(.pages)').forEach(div=>{
        let hasVisible=false;
        div.querySelectorAll('p').forEach(p=>{if(p.style.display!=='none')hasVisible=true;});
        div.style.display=hasVisible?'':'none';
    });
    const children=eventMain.children;
    let currentH1=null;
    let divsInRange=[];
    for(let i=0;i<children.length;i++){
        const child=children[i];
        if(child.tagName==='H1'){
            if(currentH1!==null){
                let allHidden=true;
                if(divsInRange.length===0){allHidden=false;}
                else{for(let div of divsInRange){if(div.style.display!=='none'){allHidden=false;break;}}}
                currentH1.style.display=(allHidden&&divsInRange.length>0)?'none':'';
            }
            currentH1=child;
            divsInRange=[];
        }
        else if(child.classList&&child.classList.contains('pages')){
            if(currentH1!==null){
                let allHidden=true;
                if(divsInRange.length===0){allHidden=false;}
                else{for(let div of divsInRange){if(div.style.display!=='none'){allHidden=false;break;}}}
                currentH1.style.display=(allHidden&&divsInRange.length>0)?'none':'';
            }
            currentH1=null;
            divsInRange=[];
        }
        else if(child.tagName==='DIV'&&!child.classList.contains('pages')){divsInRange.push(child);}
    }
    if(currentH1!==null){
        let allHidden=true;
        if(divsInRange.length===0){allHidden = false;}
        else{for(let div of divsInRange){if(div.style.display!=='none'){allHidden=false;break;}}}
        currentH1.style.display=(allHidden&&divsInRange.length>0)?'none':'';
    }
}
//===外部链接===
document.querySelectorAll('a[href^="http"]').forEach(link=>{
    link.setAttribute('target','_blank');
    link.setAttribute('rel','noopener noreferrer');
});
//===初始化===
function initApp(){
    pageData=extractStructure();
    window.addEventListener('hashchange',handleHashChange);
    handleHashChange();
    generateContents();
    generateNavigation();
    const stored=localStorage.getItem('setting');
    if(stored){settings=JSON.parse(stored);}
    else{localStorage.setItem('setting',JSON.stringify(settings));}
    applySettings();
    applyBG();
}
window.addEventListener('DOMContentLoaded',function(){
    restoreFromDB().then(()=>{initApp()}).catch(()=>{deleteDB();initApp()});
});
