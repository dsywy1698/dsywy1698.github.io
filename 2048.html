<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>2048</title>
<style>
*{
  margin:0;padding:0;box-sizing:border-box;font-family:sans-serif;
  transition:transform 0.2s,opacity 0.2s;scrollbar-width:none;font-weight:700;user-select:none;
}
body{
  width:100vw;height:100vh;padding:12px;background:#eee4da;color:#1f2937;gap:12px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
button{border:none;outline:none;}
nav{
  width:100%;display:flex;gap:8px;justify-content:center;
  >b,>button{height:60px;padding:8px;text-align:center;background:#bbada0;border-radius:12px;font-family:consolas;}
  >b{position:relative;width:80px;font-size:18px;line-height:28px;color:#fff;}
  >button{width:60px;color:#eee4da;font-size:24px;line-height:48px;}
  #score::before,#best::before{position:static;display:block;color:#eee4da;line-height:16px;font-size:14px;}
  #score::before{content:'得分';}#best::before{content:'最高分';}
  >b>i{position:absolute;left:50%;font-size:14px;font-style:normal;color:#776e65;animation:up 0.6s both;}
}
#board{
  --gap:12px;width:100%;max-width:480px;padding:var(--gap);
  position:relative;background:#bbada0;border-radius:20px;touch-action:none;
  >#cells{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--gap);}
  >#cells>div{aspect-ratio:1;border-radius:12px;background:#0002;}
  >#tiles{position:absolute;inset:var(--gap);}
  >#tiles>div{
    position:absolute;width:calc((100% - 3*var(--gap))/4);height:calc((100% - 3*var(--gap))/4);
    transform:translate(calc(var(--x)*(100% + var(--gap))),calc(var(--y)*(100% + var(--gap))));
    transition:0.1s ease-in-out;transition-property:transform;
    >i{
      display:flex;width:100%;height:100%;align-items:center;justify-content:center;
      border-radius:12px;font-style:normal;font-size:min(11vw,44px);
    }
    &[data-len="3"]>i{font-size:min(8.5vw,34px);}
    &[data-len="4"]>i{font-size:min(6.5vw,26px);}
    &[data-len="5"]>i{font-size:min(5.5vw,22px);}
    &[data-new]>i{animation:new 0.2s ease 0.1s both;}
    &[data-merge]>i{animation:merge 0.2s ease 0.1s both;}
  }
}
#msg{
  position:absolute;inset:0;z-index:2;opacity:0;pointer-events:none;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:16px;backdrop-filter:blur(4px);border-radius:20px;
  &.show{opacity:1;pointer-events:auto;}
  >p{font-size:32px;}>div{display:flex;gap:8px;}
  >div>button{height:36px;padding:0 16px;border-radius:18px;background:#8f7a66;color:#f9f6f2;font-size:14px;}
  &[data-s="won"]{background:#edc22e80;color:#f9f6f2;}
  &[data-s="over"]{background:#eee4da80;#keep{display:none;}}
}
@keyframes new{0%{opacity:0;transform:scale(0)}100%{opacity:1;transform:scale(1)}}
@keyframes merge{0%{transform:scale(0)}50%{transform:scale(1.2)}100%{transform:scale(1)}}
@keyframes up{0%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-24px)}}
@media(width<=400px){#board{--gap:8px;}#msg>p{font-size:24px;}}
</style>
</head>
<body>
<nav><b id="score">0</b><b id="best">0</b><button id="new">新</button></nav>
<div id="board">
  <div id="cells"></div><div id="tiles"></div>
  <div id="msg" data-s="over">
    <p id="tip"></p>
    <div><button id="keep">继续</button><button id="again">重来</button></div>
  </div>
</div>
<script>
//状态与工具
const N=4;
let state={cells:[],score:0,best:0,over:false,won:false,keep:false};
let last=0;
const els={
  score:document.getElementById('score'),
  best:document.getElementById('best'),
  cells:document.getElementById('cells'),
  tiles:document.getElementById('tiles'),
  msg:document.getElementById('msg'),
  tip:document.getElementById('tip'),
  board:document.getElementById('board')
};
const SKIN={
  2:'#eee4da',4:'#ede0c8',8:'#f2b179',16:'#f59563',32:'#f67c5f',64:'#f65e3b',
  128:'#edcf72',256:'#edcc61',512:'#edc850',1024:'#edc53f',2048:'#edc22e'
};
const skin=v=>SKIN[v]||'#3c3a32';
const ink=v=>v<8?'#776e65':'#f9f6f2';
const empty=()=>Array.from({length:N},()=>Array(N).fill(null));
const inside=(x,y)=>x>=0&&x<N&&y>=0&&y<N;
const at=(x,y)=>inside(x,y)?state.cells[x][y]:null;
const free=()=>{
  let a=[];
  for(let x=0;x<N;x++)for(let y=0;y<N;y++)if(!state.cells[x][y])a.push({x,y});
  return a;
};
const getBest=()=>+localStorage.getItem('bestScore')||0;
const setBest=v=>localStorage.setItem('bestScore',v);
const loadState=()=>{
  try{let d=JSON.parse(localStorage.getItem('gameState'));return d&&d.list?d:null;}catch(e){return null;}
};
const saveState=()=>{
  let list=[];
  for(let x=0;x<N;x++)for(let y=0;y<N;y++){
    let t=state.cells[x][y];
    if(t)list.push({x,y,v:t.v});
  }
  localStorage.setItem('gameState',JSON.stringify({list,score:state.score,over:state.over,won:state.won,keep:state.keep}));
};
//渲染
let renderId=0;
const renderAll=()=>{
  const id=++renderId;
  let list=[];
  for(let x=0;x<N;x++)for(let y=0;y<N;y++){
    let t=state.cells[x][y];
    if(!t)continue;
    if(t.from)t.from.forEach(s=>list.push({t:s,ghost:true}));
    list.push({t,ghost:false});
  }
  els.tiles.innerHTML=list.map(({t,ghost})=>{
    let cx=t.px===null?t.x:t.px,cy=t.py===null?t.y:t.py;
    let anim=t.merged?' data-merge':t.fresh?' data-new':'';
    return `<div data-len="${String(t.v).length}"${ghost?' data-ghost':''} style="--x:${cx};--y:${cy}"${anim}>`+
      `<i style="background:${skin(t.v)};color:${ink(t.v)}">${t.v}</i></div>`;
  }).join('');
  let moving=list.some(({t})=>t.px!==null&&(t.px!==t.x||t.py!==t.y));
  if(moving){
    void els.tiles.offsetHeight;
    [...els.tiles.children].forEach((el,i)=>{
      el.style.setProperty('--x',list[i].t.x);
      el.style.setProperty('--y',list[i].t.y);
    });
    setTimeout(()=>{
      if(id!==renderId)return;
      els.tiles.querySelectorAll('[data-ghost]').forEach(el=>el.remove());
    },320);
  }
  els.score.textContent=state.score;
  els.best.textContent=state.best;
  if(state.score>last){
    let i=document.createElement('i');
    i.textContent='+'+(state.score-last);
    els.score.appendChild(i);
    setTimeout(()=>i.remove(),600);
  }
  last=state.score;
  els.msg.classList.toggle('show',state.over||(state.won&&!state.keep));
  els.msg.dataset.s=state.over?'over':'won';
  els.tip.textContent=state.over?'游戏结束':'达成 2048';
};
//操作
const sync=()=>{
  if(state.score>state.best){state.best=state.score;setBest(state.best);}
  if(state.over)localStorage.removeItem('gameState');else saveState();
  renderAll();
};
const addRandom=()=>{
  let a=free();
  if(!a.length)return;
  let v=Math.random()<0.9?2:4;
  let p=a[Math.floor(Math.random()*a.length)];
  state.cells[p.x][p.y]={v,x:p.x,y:p.y,px:null,py:null,fresh:true};
};
const reset=()=>{
  state.cells=empty();
  state.score=0;state.over=false;state.won=false;state.keep=false;last=0;
  addRandom();addRandom();
  sync();
};
const restore=()=>{
  let d=loadState();
  if(!d)return reset();
  state.cells=empty();
  d.list.forEach(t=>{state.cells[t.x][t.y]={v:t.v,x:t.x,y:t.y,px:t.x,py:t.y};});
  state.score=d.score;state.over=d.over;state.won=d.won;state.keep=d.keep;last=d.score;
  renderAll();
};
const prepare=()=>{
  for(let x=0;x<N;x++)for(let y=0;y<N;y++){
    let t=state.cells[x][y];
    if(!t)continue;
    t.merged=false;t.from=null;t.fresh=false;
    t.px=t.x;t.py=t.y;
  }
};
const place=(t,x,y)=>{
  state.cells[t.x][t.y]=null;
  state.cells[x][y]=t;
  t.x=x;t.y=y;
};
const farthest=(x,y,v)=>{
  let fx=x,fy=y,nx,ny;
  while(true){
    nx=fx+v.x;ny=fy+v.y;
    if(!inside(nx,ny)||state.cells[nx][ny])break;
    fx=nx;fy=ny;
  }
  return {fx,fy,nx,ny};
};
const canMove=()=>{
  if(free().length)return true;
  for(let x=0;x<N;x++)for(let y=0;y<N;y++){
    let t=at(x,y);
    if(!t)continue;
    for(let v of VEC){let o=at(x+v.x,y+v.y);if(o&&o.v===t.v)return true;}
  }
  return false;
};
const VEC=[{x:0,y:-1},{x:1,y:0},{x:0,y:1},{x:-1,y:0}];
const move=dir=>{
  if(state.over||(state.won&&!state.keep))return;
  let v=VEC[dir];
  prepare();
  let xs=[0,1,2,3],ys=[0,1,2,3],moved=false;
  if(v.x===1)xs.reverse();
  if(v.y===1)ys.reverse();
  xs.forEach(x=>ys.forEach(y=>{
    let t=at(x,y);
    if(!t)return;
    let f=farthest(x,y,v);
    let next=at(f.nx,f.ny);
    if(next&&next.v===t.v&&!next.merged){
      let m={v:t.v*2,x:f.nx,y:f.ny,px:null,py:null,merged:true,from:[t,next]};
      state.cells[f.nx][f.ny]=m;
      state.cells[x][y]=null;
      t.x=f.nx;t.y=f.ny;
      next.x=f.nx;next.y=f.ny;
      state.score+=m.v;
      if(m.v===2048)state.won=true;
      moved=true;
      return;
    }
    place(t,f.fx,f.fy);
    if(f.fx!==x||f.fy!==y)moved=true;
  }));
  if(!moved)return;
  addRandom();
  if(!canMove())state.over=true;
  sync();
};
//事件
const KEY={arrowup:0,arrowright:1,arrowdown:2,arrowleft:3,w:0,d:1,s:2,a:3,k:0,l:1,j:2,h:3};
document.addEventListener('keydown',e=>{
  if(e.altKey||e.ctrlKey||e.metaKey||e.shiftKey)return;
  let k=e.key.toLowerCase();
  if(k==='r'){reset();return;}
  let d=KEY[k];
  if(d===undefined)return;
  e.preventDefault();
  move(d);
});
document.addEventListener('click',e=>{
  if(e.target.closest('#new')||e.target.closest('#again'))reset();
  else if(e.target.closest('#keep')){state.keep=true;renderAll();}
});
let sx=0,sy=0;
els.board.addEventListener('touchstart',e=>{
  if(e.touches.length>1)return;
  sx=e.touches[0].clientX;sy=e.touches[0].clientY;
},{passive:true});
els.board.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
els.board.addEventListener('touchend',e=>{
  let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  let ax=Math.abs(dx),ay=Math.abs(dy);
  if(Math.max(ax,ay)<16)return;
  move(ax>ay?(dx>0?1:3):(dy>0?2:0));
});
//启动
els.cells.innerHTML='<div></div>'.repeat(16);
state.best=getBest();
restore();
</script>
</body>
</html>
