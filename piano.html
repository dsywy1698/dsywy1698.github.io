<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>HTML钢琴</title>
<style>
*{margin:0;padding:0;font-family:sans-serif;box-sizing:border-box;scrollbar-width:none;}
body{background:#0d1117;color:#000;overflow:hidden;display:flex;flex-direction:column;height:100dvh;}
nav{position:fixed;z-index:1;top:4px;right:4px;display:flex;gap:2px;}
nav>button{
  overflow:hidden;width:52px;height:36px;border:none;outline:none;
  color:#fff;background:#2228;font-size:14px;text-wrap:nowrap;user-select:none;
  backdrop-filter:blur(5px);border-radius:18px;transition:0.2s;
  &:hover,&.active{background:#fff1;}&:disabled{color:#fff5;}
}
textarea{
  flex:1;width:100%;min-height:60px;border:none;outline:none;resize:none;background:#0d1117;
  padding:56px 10px 6px;font-size:14px;font-family:consolas,monospace;color:#cdd;
  user-select:text;transition:0.2s;
  mask-image:linear-gradient(to bottom,#0004 0,#000 32px,#000 calc(100% - 10px),#0008 100%);
  &:disabled{opacity:0.4;}
}
main{
  width:100dvw;height:240px;flex-shrink:0;position:relative;overflow-x:auto;
  >div{display:flex;width:1300px;height:160px;}
  >div>b{
    position:relative;display:flex;justify-content:center;align-items:flex-end;
    padding-bottom:10px;overflow:hidden;cursor:pointer;font-weight:400;
    border-radius:0 0 5px 5px;transition:0.1s;user-select:none;
    &.active,&:active{background:#993!important;}
  }
  >div:first-child>b{
    width:25px;height:160px;
    &:nth-child(7n+1){background:#e3e3f3}
    &:nth-child(7n+2){background:#eeeeff}
    &:nth-child(7n+3){background:#ababbb}
    &:nth-child(7n+4){background:#b6b6c6}
    &:nth-child(7n+5){background:#c1c1d1}
    &:nth-child(7n+6){background:#ccccdd}
    &:nth-child(7n+7){background:#d9d9e9}
    &[data-c4]{font-weight:600;}
  }
  >div:last-child{
    margin-top:-160px;padding:0 10px;
    >b{width:20px;height:100px;margin-left:5px;background:#211;color:#0000;}
    >b[data-e]{opacity:0;pointer-events:none;}
  }
}
@media(width>=1300px){main>div{width:100dvw;&:first-child>b{width:100%!important}&:last-child{padding:0 calc(100dvw/104);>b{width:calc(100dvw/104*3);margin:0 calc(100dvw/312)}}}}
</style>
</head>
<body>
<nav>
  <button id="rec">记录</button>
  <button id="play">演奏</button>
  <button id="clear">清空</button>
  <button id="note">音名</button>
  <button id="bpm">120</button>
</nav>
<textarea spellcheck="false"></textarea>
<main></main>
<script>
//状态与工具
let actx=null;
let state={
  recording:false,playing:false,stop:true,
  groups:[],groupIndex:0,
  partTimers:[],partStates:[],partActive:false,
  bpm:120,bpmIndex:2,notation:'pitch'
};
const BPM=[60,90,120,140,180,240,360,480];
const MODE=['pitch','solfa'];
const MODE_LABEL={pitch:'音名',solfa:'唱名'};
const SOLFA={C:1,D:2,E:3,F:4,G:5,A:6,B:7};
const PITCH={1:'C',2:'D',3:'E',4:'F',5:'G',6:'A',7:'B'};
const POS={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
const WHITE=['A0','B0','C1','D1','E1','F1','G1','A1','B1','C2','D2','E2','F2','G2','A2','B2','C3','D3','E3','F3','G3','A3','B3','C4','D4','E4','F4','G4','A4','B4','C5','D5','E5','F5','G5','A5','B5','C6','D6','E6','F6','G6','A6','B6','C7','D7','E7','F7','G7','A7','B7','C8'];
const BLACK=['A#0',null,'C#1','D#1',null,'F#1','G#1','A#1',null,'C#2','D#2',null,'F#2','G#2','A#2',null,'C#3','D#3',null,'F#3','G#3','A#3',null,'C#4','D#4',null,'F#4','G#4','A#4',null,'C#5','D#5',null,'F#5','G#5','A#5',null,'C#6','D#6',null,'F#6','G#6','A#6',null,'C#7','D#7',null,'F#7','G#7','A#7',null];
const keyMap={};
const tx=document.querySelector('textarea');
const els={
  rec:document.getElementById('rec'),
  play:document.getElementById('play'),
  clear:document.getElementById('clear'),
  note:document.getElementById('note'),
  bpm:document.getElementById('bpm'),
  help:document.querySelector('nav>div')
};
let master=null;
const getCtx=()=>{
  if(!actx){
    actx=new(window.AudioContext||window.webkitAudioContext)();
    const comp=actx.createDynamicsCompressor();
    comp.threshold.value=-14;comp.knee.value=20;comp.ratio.value=6;
    comp.attack.value=0.004;comp.release.value=0.25;
    master=actx.createGain();
    master.gain.value=0.5;
    master.connect(comp);comp.connect(actx.destination);
  }
  if(actx.state==='suspended')actx.resume();
  return actx;
};
const PC=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const nameFromSemi=s=>PC[s%12]+Math.floor(s/12);
const getFreq=name=>{
  const m=String(name).toUpperCase().match(/^([A-G])([#B]?)(\d)$/);
  if(!m)return null;
  const semi=+m[3]*12+POS[m[1]]+(m[2]==='#'?1:m[2]==='B'?-1:0);
  if(semi<9||semi>96)return null;
  return 440*Math.pow(2,(semi-57)/12);
};
const getSemi=name=>{
  const m=String(name).toUpperCase().match(/^([A-G])([#B]?)(\d)$/);
  if(!m)return null;
  return +m[3]*12+POS[m[1]]+(m[2]==='#'?1:m[2]==='B'?-1:0);
};
const getBase=()=>60/Math.max(40,Math.min(480,state.bpm));
//草稿持久化
const STORE='html-piano-v1';
const saveState=()=>{
  try{localStorage.setItem(STORE,JSON.stringify({
    text:tx.value,bpm:state.bpm,bpmIndex:state.bpmIndex,notation:state.notation
  }));}catch(e){}
};
const loadState=()=>{
  let d=null;
  try{d=JSON.parse(localStorage.getItem(STORE)||'null');}catch(e){}
  if(!d)return;
  if(typeof d.text==='string')tx.value=d.text;
  if(BPM.indexOf(d.bpm)>=0){state.bpm=d.bpm;state.bpmIndex=BPM.indexOf(d.bpm);}
  if(MODE.indexOf(d.notation)>=0)state.notation=d.notation;
};
let saveTimer=null;
const scheduleSave=()=>{clearTimeout(saveTimer);saveTimer=setTimeout(saveState,500);};
//在光标处插入文本
const insertText=str=>{
  tx.focus();
  let ok=false;
  try{ok=document.execCommand('insertText',false,str);}catch(e){ok=false;}
  if(!ok){
    const s=tx.selectionStart,e=tx.selectionEnd;
    tx.setRangeText(str,s,e,'end');
    tx.dispatchEvent(new Event('input',{bubbles:true}));
  }
  tx.scrollTop=tx.scrollHeight;
};
//音色
const playNote=(name,dur)=>{
  const f=getFreq(name);
  if(!f)return;
  const ctx=getCtx(),now=ctx.currentTime;
  dur=dur||0.35+(1.6-18e-5*(f-27.5));
  if(dur<0.05)dur=0.05;
  const atk=Math.min(0.008,dur*0.2);
  [[1,0.38,0],[1,0.16,1.2],[2,0.22,-0.8],[3,0.1,1.8],[4,0.05,-1.5]].forEach(p=>{
    const osc=ctx.createOscillator(),gain=ctx.createGain();
    osc.type='sine';
    osc.frequency.setValueAtTime(f*p[0]+p[2],now);
    gain.gain.setValueAtTime(0.7*p[1]*0.2,now);
    gain.gain.linearRampToValueAtTime(0.7*p[1],now+atk);
    gain.gain.exponentialRampToValueAtTime(3e-4,now+dur);
    osc.connect(gain);gain.connect(master);
    osc.start(now);osc.stop(now+dur);
  });
  const osc=ctx.createOscillator(),gain=ctx.createGain();
  osc.type='triangle';
  osc.frequency.setValueAtTime(5.3*f,now);
  osc.frequency.exponentialRampToValueAtTime(1.1*f,now+0.04);
  gain.gain.setValueAtTime(0.06,now);
  gain.gain.exponentialRampToValueAtTime(1e-4,now+0.05);
  osc.connect(gain);gain.connect(master);
  osc.start(now);osc.stop(now+0.06);
};
//记谱转换
const scanTokens=(text,fn)=>{
  let out='',i=0;
  while(i<text.length){
    const start=i;let tok=null;
    if(isLetter(text[i])){
      i++;
      let acc='';
      if(text[i]==='#'||text[i]==='b')acc=text[i++];
      let oct='';
      if(text[i]>='0'&&text[i]<='8')oct=text[i++];
      else if(!acc&&(text[i]==='#'||text[i]==='b'))acc=text[i++];
      let chord='';
      if(text[i]==='M'||text[i]==='m')chord=text[i++];
      let dur='';
      while(i<text.length&&(text[i]==='/'||text[i]==='.'||text[i]==='-'))dur+=text[i++];
      tok={kind:'pitch',raw:text.substring(start,i),acc,oct,chord,dur};
    }else if(text[i]>='1'&&text[i]<='7'){
      i++;
      let acc='';
      if(text[i]==='#'||text[i]==='b')acc=text[i++];
      let octMod='';
      while(i<text.length&&(text[i]==="'"||text[i]===','))octMod+=text[i++];
      if(!acc&&(text[i]==='#'||text[i]==='b'))acc=text[i++];
      let chord='';
      if(text[i]==='M'||text[i]==='m')chord=text[i++];
      let dur='';
      while(i<text.length&&(text[i]==='/'||text[i]==='.'||text[i]==='-'))dur+=text[i++];
      tok={kind:'solfa',raw:text.substring(start,i),acc,octMod,chord,dur};
    }
    if(!tok){out+=text[i++];continue;}
    out+=fn(tok);
  }
  return out;
};
const tokenText=t=>t.raw;
const pitchToSolfa=t=>{
  const letter=t.raw[0].toUpperCase();
  if(!SOLFA[letter])return t.raw;
  let octMod='';
  if(t.oct){
    const off=+t.oct-4;
    octMod=off>0?"'".repeat(off):off<0?','.repeat(-off):'';
  }
  return SOLFA[letter]+t.acc+octMod+t.chord+t.dur;
};
const solfaToPitch=t=>{
  const num=t.raw[0];
  if(!PITCH[num])return t.raw;
  const up=(t.octMod.match(/'/g)||[]).length,down=(t.octMod.match(/,/g)||[]).length;
  return PITCH[num]+t.acc+(4+up-down)+t.chord+t.dur;
};
const perLine=(text,fn)=>text.split(/\r?\n/).map(fn).join('\n');
const toSolfa=text=>perLine(text,line=>{
  const st={oct:4};
  return scanTokens(line,t=>{
    if(t.kind==='solfa'||!SOLFA[t.raw[0].toUpperCase()])return tokenText(t);
    const tok=t.oct?t:{...t,oct:String(st.oct)};
    st.oct=+tok.oct;
    return pitchToSolfa(tok);
  });
});
const toPitch=text=>perLine(text,line=>scanTokens(line,t=>t.kind==='pitch'?tokenText(t):solfaToPitch(t)));
const noteName=name=>state.notation==='pitch'?name:toSolfa(name);
const switchMode=()=>{
  const next=MODE[(MODE.indexOf(state.notation)+1)%MODE.length];
  if(state.notation==='pitch'&&next==='solfa')tx.value=toSolfa(tx.value);
  else if(state.notation==='solfa'&&next==='pitch')tx.value=toPitch(tx.value);
  state.notation=next;
  updateBtn();
};
//键盘
let keyEls=[];
const renderKeys=()=>{
  const main=document.querySelector('main');
  main.innerHTML='<div>'+WHITE.map(n=>`<b${n==='C4'?' data-c4':''}>${n}</b>`).join('')+'</div>'+
    '<div>'+BLACK.map(n=>n?`<b>${n}</b>`:'<b data-e></b>').join('')+'</div>';
  keyEls=[...main.querySelectorAll('b:not([data-e])')];
  keyEls.forEach(b=>{if(b.textContent)keyMap[b.textContent]=b;});
};
const lightKeys=names=>{
  const lit=[];
  names.forEach(n=>{const el=keyMap[n];if(el){el.classList.add('active');lit.push(el);}});
  return lit;
};
const clearLight=()=>document.querySelectorAll('main b.active').forEach(b=>b.classList.remove('active'));
//语法解析
const isSpace=c=>c===' '||c==='\n'||c==='\r'||c==='\t';
const isLetter=c=>(c>='A'&&c<='G')||(c>='a'&&c<='g');
const removeComments=text=>{
  let out='',i=0;
  while(i<text.length){
    if(text[i]==='('){i++;while(i<text.length&&text[i]!==')')i++;if(i<text.length)i++;}
    else{out+=text[i];i++;}
  }
  return out;
};
const parseDuration=(text,i)=>{
  let dur=1;
  while(i<text.length){
    const c=text[i];
    if(c==='/')dur/=2;
    else if(c==='.')dur*=1.5;
    else if(c==='-')dur+=1;
    else break;
    i++;
  }
  return {dur:Math.round(dur*1e6)/1e6,pos:i};
};
const parseNote=(text,i,st)=>{
  let semi=null;
  if(isLetter(text[i])){
    const letter=text[i++].toUpperCase();
    let acc=0;
    if(text[i]==='#')acc=1;
    else if(text[i]==='b')acc=-1;
    if(acc)i++;
    let oct=st.oct;
    if(text[i]>='0'&&text[i]<='8')oct=+text[i++];
    if(!acc&&(text[i]==='#'||text[i]==='b')){acc=text[i]==='#'?1:-1;i++;}
    st.oct=oct;
    semi=oct*12+POS[letter]+acc;
  }else if(text[i]>='1'&&text[i]<='7'){
    const num=+text[i++];
    let acc=0;
    if(text[i]==='#')acc=1;
    else if(text[i]==='b')acc=-1;
    if(acc)i++;
    let up=0,down=0;
    while(i<text.length&&(text[i]==="'"||text[i]===',')){
      if(text[i]==="'")up++;else down++;
      i++;
    }
    if(!acc&&(text[i]==='#'||text[i]==='b')){acc=text[i]==='#'?1:-1;i++;}
    semi=(4+up-down)*12+POS[PITCH[num]]+acc;
  }else return null;
  let chord=null;
  if(text[i]==='M')chord=4;
  else if(text[i]==='m')chord=3;
  if(chord)i++;
  const d=parseDuration(text,i);
  const raw=chord?[semi,semi+chord,semi+7]:[semi];
  const names=raw.map(nameFromSemi).filter(n=>getFreq(n));
  if(!names.length)return null;
  return {names,dur:d.dur,pos:d.pos};
};
const parseSequence=text=>{
  const events=[];let i=0;const st={oct:4};
  const skip=()=>{while(i<text.length&&(isSpace(text[i])||text[i]==='|'))i++;};
  while(i<text.length){
    skip();
    if(i>=text.length)break;
    const c=text[i];
    if(c==='0'){
      i++;
      const d=parseDuration(text,i);
      events.push({t:'r',dur:d.dur});i=d.pos;continue;
    }
    if(isLetter(c)||(c>='1'&&c<='7')){
      const res=parseNote(text,i,st);
      if(!res)return null;
      events.push({t:res.names.length===1?'n':'c',names:res.names,dur:res.dur});i=res.pos;continue;
    }
    if(/[a-z]/i.test(c)||c>='1'&&c<='8'){i++;continue;}
    return null;
  }
  return events;
};
const parseScore=text=>{
  const groups=[];
  const lines=text.split(/\r?\n/);
  for(let n=0;n<lines.length;n++){
    let line=lines[n],sync=false;
    if(/^\s*@/.test(line)){sync=true;line=line.replace(/^\s*@/,'');}
    const clean=removeComments(line);
    if(clean.trim()==='')continue;
    const events=parseSequence(clean);
    if(!events)return {valid:false,groups:[],error:'第'+(n+1)+'行解析失败'};
    if(!events.length)continue;
    if(sync&&groups.length)groups[groups.length-1].push({events});
    else groups.push([{events}]);
  }
  return {valid:true,groups};
};
//播放
const updateBtn=()=>{
  els.rec.textContent=state.recording?'停止':'记录';
  els.rec.classList.toggle('active',state.recording);
  els.play.textContent=state.playing?'停止':'演奏';
  els.play.classList.toggle('active',state.playing);
  els.bpm.textContent=state.bpm;
  els.note.textContent=MODE_LABEL[state.notation];
  els.bpm.disabled=state.playing;
  els.note.disabled=state.playing||state.recording;
  tx.disabled=state.playing;
  keyEls.forEach(b=>{b.style.pointerEvents=state.playing?'none':'';});
};
const stopParts=()=>{
  state.partActive=false;
  state.partTimers.forEach(t=>{if(t)clearTimeout(t);});
  state.partTimers=[];state.partStates=[];
  clearLight();
};
const stopPlay=()=>{
  state.playing=false;state.stop=true;
  state.groupIndex=0;state.groups=[];
  stopParts();
  updateBtn();
};
const playPart=i=>{
  if(!state.partActive)return;
  const s=state.partStates[i];
  if(!s||s.done)return;
  if(s.activeKeys)s.activeKeys.forEach(el=>el.classList.remove('active'));
  s.activeKeys=[];
  if(s.idx>=s.events.length){
    s.done=true;
    if(state.partStates.every(x=>x.done))nextGroup();
    return;
  }
  const item=s.events[s.idx];
  const sec=getBase()*(item.dur||1);
  if(item.t!=='r'){
    s.activeKeys=lightKeys(item.names);
    item.names.forEach(n=>playNote(n,sec*0.95));
  }
  s.idx++;
  state.partTimers[i]=setTimeout(()=>playPart(i),sec*1000);
};
const startGroup=()=>{
  const group=state.groups[state.groupIndex];
  if(!group){stopPlay();return;}
  clearLight();
  state.partActive=true;
  state.partTimers=[];state.partStates=[];
  group.forEach(p=>{
    state.partStates.push({events:p.events||[],idx:0,done:false,activeKeys:[]});
    state.partTimers.push(null);
  });
  state.partStates.forEach((s,j)=>playPart(j));
};
const nextGroup=()=>{
  state.partActive=false;
  state.partTimers.forEach(t=>{if(t)clearTimeout(t);});
  state.partTimers=[];state.partStates=[];
  state.groupIndex++;
  if(state.stop||!state.playing||state.groupIndex>=state.groups.length){stopPlay();return;}
  startGroup();
};
const togglePlay=()=>{
  let txt=tx.value;
  if(state.notation==='solfa')txt=toPitch(txt);
  if(state.playing){stopPlay();return;}
  const res=parseScore(txt);
  if(!res.valid){
    if(txt.trim()==='')return;
    alert('语法错误\n'+(res.error||''));
    return;
  }
  if(txt.trim()==='')return;
  if(!res.groups.length){alert('内容为空');return;}
  getCtx();
  state.playing=true;state.stop=false;
  state.groups=res.groups;state.groupIndex=0;
  updateBtn();
  startGroup();
};
//记录
const toggleRec=()=>{
  if(state.playing)return;
  state.recording=!state.recording;
  updateBtn();
  if(state.recording)tx.focus();
};
const onKeyClick=name=>{
  if(state.playing||!getFreq(name))return;
  playNote(name);
  if(!state.recording)return;
  insertText(noteName(name));
};
//事件
const mainEl=document.querySelector('main');
mainEl.addEventListener('click',e=>{
  const b=e.target.closest('b');
  if(b&&b.textContent)onKeyClick(b.textContent);
});
mainEl.addEventListener('touchstart',e=>{
  const b=e.target.closest('b');
  if(!b||!b.textContent)return;
  e.preventDefault();
  onKeyClick(b.textContent);
},{passive:false});
document.addEventListener('click',e=>{
  if(els.help.contains(e.target)||els.use.contains(e.target))return;
  els.help.classList.remove('show');
});
document.body.addEventListener('touchmove',e=>{if(e.target.tagName==='B')e.preventDefault();},{passive:false});
els.rec.addEventListener('click',toggleRec);
els.play.addEventListener('click',togglePlay);
els.clear.addEventListener('click',()=>{
  if(state.playing||!tx.value)return;
  if(!confirm('清空当前乐谱？'))return;
  tx.focus();
  tx.setSelectionRange(0,tx.value.length);
  let ok=false;
  try{ok=document.execCommand('delete');}catch(e){ok=false;}
  if(!ok)tx.value='';
  saveState();
  tx.focus();
});
els.bpm.addEventListener('click',()=>{
  if(state.playing)return;
  state.bpmIndex=(state.bpmIndex+1)%BPM.length;
  state.bpm=BPM[state.bpmIndex];
  saveState();
  updateBtn();
});
els.note.addEventListener('click',()=>{if(!state.playing&&!state.recording){switchMode();saveState();}});
tx.addEventListener('keydown',e=>{if(state.playing)e.preventDefault();});
tx.addEventListener('input',scheduleSave);
window.addEventListener('pagehide',saveState);
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveState();});
//启动
renderKeys();
loadState();
updateBtn();
tx.focus();
</script>
</body>
</html>
